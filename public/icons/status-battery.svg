<!-- Apple iPhone-style battery - white outline and fill, compressed horizontally -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 12" aria-hidden="true">
  <!-- Main body - white outline -->
  <rect x="1" y="2.5" width="14" height="7" rx="1.8" ry="1.8" fill="none" stroke="#ffffff" stroke-width="0.6"/>
  <!-- Positive terminal/cap - white outline -->
  <rect x="15" y="3.5" width="2" height="5" rx="0.9" ry="0.9" fill="none" stroke="#ffffff" stroke-width="0.6"/>
  <!-- Charge fill - white, larger (fills most of body) -->
  <rect x="2.2" y="3.5" width="11.6" height="5" rx="1.4" ry="1.4" fill="#ffffff"/>
</svg>
